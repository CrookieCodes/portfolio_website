<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carol Elizabeth · Service and UX Designer</title>
  <meta name="description" content="Portfolio of Carol Elizabeth, a Service and UX Designer pursuing a Masters in Design at IIT Delhi.">

  <!-- Order matters: tokens first, then fonts and base, then one file per section. -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/splash.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/scene.css">

  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Screen 1: splash. Decorative intro, so the logo has empty alt. -->
  <div class="splash">
    <!-- PLACEHOLDER: export Figma node 1:488 as assets/icons/logo-splash.svg -->
    <img class="splash__logo" src="assets/placeholders/logo-splash.svg" alt="" width="199" height="199">
  </div>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-header__logo" href="/">
        <!-- PLACEHOLDER: export the burgundy logo cross as assets/icons/logo-cross-burgundy.svg
             (Phase 4 swaps colours per section: pale-teal, bronze, teal, tan) -->
        <img class="site-header__logo-image" src="assets/placeholders/logo-cross-burgundy.svg" alt="Carol Elizabeth, home" width="61" height="61">
      </a>
      <nav class="site-nav" aria-label="Main">
        <ul class="site-nav__list">
          <li><a class="site-nav__link" href="#about">About</a></li>
          <li><a class="site-nav__link" href="#work">Work</a></li>
          <!-- TODO: Resume destination (PDF?) -->
          <li><a class="site-nav__link" href="#">Resume</a></li>
          <li><a class="site-nav__link" href="#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <!-- Screen 2: hero -->
    <section class="frame hero" aria-labelledby="hero-title">
      <div class="container hero__inner">
        <h1 class="hero__title" id="hero-title">
          <span class="hero__line-1">Hey, I’m Carol Elizabeth.</span>
          <span class="hero__line-2">I design <span class="hero__highlight">products.</span></span>
        </h1>
        <div class="hero__eyes">
          <!-- PLACEHOLDER: export node 1:248 as assets/images/eye.svg (one file, used twice) -->
          <img class="hero__eye" src="assets/placeholders/eye.svg" alt="" width="371" height="239">
          <img class="hero__eye" src="assets/placeholders/eye.svg" alt="" width="371" height="239">
        </div>
      </div>
    </section>

    <!-- Screen 3: touchpoints scene -->
    <section class="frame scene" aria-labelledby="touchpoints-title">
      <div class="container scene__inner">
        <!-- PLACEHOLDER: export node 1:270 as assets/images/touchpoint-diagram.svg -->
        <!-- TODO: alt text for the touchpoint diagram -->
        <img class="scene__art scene__diagram" src="assets/placeholders/touchpoint-diagram.svg" alt="TODO" width="1340" height="725">
        <!-- PLACEHOLDER: export node 1:252 as assets/images/hand.svg -->
        <img class="scene__art scene__hand" src="assets/placeholders/hand.svg" alt="" width="256" height="369">

        <div class="scene__text scene__text--touchpoints">
          <h2 id="touchpoints-title">
            <span class="scene__line-1">From assembling</span>
            <span class="scene__line-2">touchpoints,</span>
          </h2>
          <ul class="scene__list scene__list--touchpoints">
            <li class="scene__item">UX Research</li>
            <li class="scene__item">Service Design</li>
            <li class="scene__item">Systems Design</li>
          </ul>
        </div>
      </div>
    </section>

    <!-- Screen 4: experiences scene -->
    <section class="frame scene scene--experiences" aria-labelledby="experiences-title">
      <!-- PLACEHOLDER: export the street photo (with its grain/darkening) as assets/images/street-photo.webp -->
      <!-- TODO: alt text for the street photograph; licence credit decision pending -->
      <img class="scene__photo" src="assets/placeholders/street-photo.svg" alt="TODO" width="1920" height="1080">
      <!-- PLACEHOLDER: export nodes 1:311, 1:313, 1:314 as assets/images/silhouette-1.svg, -2.svg, -3.svg -->
      <img class="scene__silhouette scene__silhouette--1" src="assets/placeholders/silhouette-1.svg" alt="" width="158" height="333">
      <img class="scene__silhouette scene__silhouette--2" src="assets/placeholders/silhouette-2.svg" alt="" width="141" height="404">
      <img class="scene__silhouette scene__silhouette--3" src="assets/placeholders/silhouette-3.svg" alt="" width="253" height="436">

      <div class="container scene__inner">
        <div class="scene__text scene__text--experiences">
          <h2 id="experiences-title">
            <span class="scene__line-1">To crafting stories,</span>
            <span class="scene__line-2">experiences.</span>
          </h2>
          <ul class="scene__list scene__list--experiences">
            <li class="scene__item">UX Strategy</li>
            <li class="scene__item">Experience Design</li>
          </ul>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
