# Netlify: redirect rules only. No build settings here, so the site settings in the
# Netlify dashboard stay in charge of the build and publish directory.
#
# Internal files are not part of the public site: each rule below answers with the
# 404 page (status 404). force = true applies the rule even though the file exists.
# Netlify serves the repository root, so keep this list in step with new internal
# files (notes, scripts, tests). Wildcards only work at the end of a path.

[[redirects]]
  from = "/design"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/design/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/review"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/review/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.mcp.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
