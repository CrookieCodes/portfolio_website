<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Background Demo</title>
    <style>
        body {
            font-family: "Helvetica Neue", sans-serif;
            margin: 0;
            color: #141414;
            background: #F6F6F4;
        }

        .hero-section {
            position: relative;
            overflow: hidden;
            min-height: 80vh;
            padding: 40px;
            box-sizing: border-box;
            background-color: #F6F6F4;
        }

        .hero-title {
            position: relative;
            z-index: 1;
            max-width: 520px;
        }

        button {
            font-family: 'Helvetica Neue', sans-serif;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 8px 16px;
            background-color: #9A3745;
        }

        .below {
            padding: 40px;
            min-height: 120vh;
        }
    </style>
</head>
<body>
    <div class="hero-section">
        <div class="hero-title">
            <h1>Hello! I am Carol Elizabeth.</h1>
            <p>I am a systems-centered <b>service designer</b> who operates across multiple scales to generate holistic <b>user experiences.</b></p>
            <button onclick="alert('Button is clickable')">View Projects</button>
        </div>
    </div>

    <div class="below">
        <p>Scroll down: the animation pauses while the hero is offscreen.</p>
    </div>

    <script src="js/hero-background.js"></script>
    <script>
        initHeroBackground(document.querySelector('.hero-section'), {
            logoUrl: 'assets/logo.svg'
        });
    </script>
</body>
</html>
